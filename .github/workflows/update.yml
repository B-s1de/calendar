name: Update SPbU calendar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r spbu_calendar/requirements.txt

      - name: Build iCalendar
        run: python spbu_calendar/build_calendar.py

      - name: Check generated calendar
        run: |
          ls -lah site
          echo "Events:"
          grep -c "BEGIN:VEVENT" site/spbu.ics || true

      - name: Create index
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>СПбГУ — расписание</title>
          </head>
          <body>
            <h1>СПбГУ — 26.М05-пс</h1>
            <p><a href="spbu.ics">Подписка на календарь (.ics)</a></p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
